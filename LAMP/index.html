<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #141414;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #555555;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #f2f2f2;
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input {
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #1BB12c;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 10px;
            width: 100%;
        }
        button:hover {
            background-color: #189a27;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Random User Generator</h1>
        <form id="userForm" action="add.php" method="POST"> <!--form fields v-->
            <input type="text" id="first" name="first" placeholder="First Name" required>
            <input type="text" id="last" name="last" placeholder="Last Name" required>
            <input type="text" id="country" name="country" placeholder="Country" required>
            <input type="text" id="phone" name="phone" placeholder="Phone" required>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <button type="submit">Add User</button>
        </form>
        <button onclick="fetchUser()">Generate New User</button> <!--regenrate button-->
    </div>

    <script>
        async function fetchUser() {
            try {
                const response = await fetch('https://randomuser.me/api/'); // Fetch a random user from the API
                const data = await response.json(); // Parse through the JSON response
                const user = data.results[0];
                document.getElementById('first').value = user.name.first;
                document.getElementById('last').value = user.name.last;
                document.getElementById('country').value = user.location.country;
                document.getElementById('phone').value = user.phone;
                document.getElementById('email').value = user.email;
            } catch (error) {
                console.error('Error fetching user:', error);
            }
        }
        // Fetch a user on page load
        fetchUser();
    </script>
</body>
</html>
